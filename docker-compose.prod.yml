services:
  app:
    environment:
      APP_ALLOWED_ORIGINS: https://${DOMAIN}

  nginx:
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: it-agency-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot_webroot:
