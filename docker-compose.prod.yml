services:
  app:
    environment:
      APP_ALLOWED_ORIGINS: https://${DOMAIN}
      APP_DOCS_ENABLED: ${APP_DOCS_ENABLED:-false}

  nginx:
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "443:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: it-agency-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot_webroot:
